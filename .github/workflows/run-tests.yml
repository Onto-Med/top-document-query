name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    name: Java formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Check Google Java Style
        uses: axel-op/googlejavaformat-action@v4
        with:
          args: "--skip-reflowing-long-strings --replace"
          skip-commit: true
          files: src/**/java/**/*.java
      - name: Print diffs
        run: git --no-pager diff --exit-code

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: Non-container tests
            selection: '!ElasticsearchAdapterTest,!TextFinderTest'
            timeout: 10
          - suite: integration
            name: Elasticsearch integration
            selection: 'ElasticsearchAdapterTest,TextFinderTest'
            timeout: 20
    env:
      GH_MAVEN_PKG_AUTH_TOKEN: ${{ secrets.GH_MAVEN_PKG_AUTH_TOKEN }}
      GH_MAVEN_PKG_USER: ${{ secrets.GH_MAVEN_PKG_USER }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Check Docker availability
        if: matrix.suite == 'integration'
        run: docker version
      - name: Run tests
        env:
          TEST_SELECTION: ${{ matrix.selection }}
        run: mvn -B test --no-transfer-progress -s .mvn-ci.xml --file pom.xml "-Dtest=$TEST_SELECTION"
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.suite }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  # Preserve the original "test" check as a gate for all suites and formatting.
  test:
    needs: [format, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TEST_RESULT: ${{ needs.checks.result }}
        run: |
          echo "Formatting: $FORMAT_RESULT; test suites: $TEST_RESULT"
          test "$FORMAT_RESULT" = success && test "$TEST_RESULT" = success
