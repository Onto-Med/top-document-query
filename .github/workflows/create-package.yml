name: Publish as dependency

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish as maven dependency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_MAVEN_PKG_AUTH_TOKEN: ${{ secrets.GH_MAVEN_PKG_AUTH_TOKEN }}
      GH_MAVEN_PKG_USER: ${{ secrets.GH_MAVEN_PKG_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}
          cache: 'maven'
          check-latest: true
      - name: Publish to GitHub Packages Apache Maven
        run: mvn -B --no-transfer-progress deploy -s $GITHUB_WORKSPACE/settings.xml -s .mvn-ci.xml --file pom.xml